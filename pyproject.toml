[project]
name = "typesafe-guardrails"
version = "0.1.0"
description = "TypeSafe System One as a guardrail inside an OpenAI Agents SDK agent, traced with Arize AX"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arize-otel>=0.13.0",
    "chainlit>=2.12.0",
    "openai-agents>=0.22.3",
    "openinference-instrumentation-openai-agents>=2.4.1",
    "python-dotenv>=1.2.3",
    "typesafe-sdk>=0.7.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/watsonville_motors"]

[tool.ruff]
line-length = 110

[dependency-groups]
dev = ["ruff>=0.14"]
